<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Join</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
  * { box-sizing: border-box; font-family: system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f6fa; color: #222; }
  .card { background: #fff; padding: 32px 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.08); text-align: center; max-width: 90vw; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  img.qr { width: 240px; height: 240px; border: 1px solid #ddd; border-radius: 8px; }
  input { padding: 10px 14px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; width: 100%; max-width: 300px; }
  input.invalid { border-color: #c62828; }
  button { margin-top: 16px; padding: 10px 24px; font-size: 16px; border: none; border-radius: 8px; background: #6d4aff; color: #fff; cursor: pointer; }
  button:hover { background: #5a3ce0; }
  p.hint { color: #666; font-size: 14px; margin-top: 14px; }
  p.error { color: #c62828; font-size: 14px; margin: 10px 0 0; min-height: 18px; }
  .big { font-size: 26px; font-weight: 600; }
  .sub { font-size: 17px; color: #444; margin-top: 6px; }

  /* Name chip grid */
  .chip-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 20px;
  }
  .chip {
    display: inline-block;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: filter .15s, transform .15s;
  }
  .chip:hover { filter: brightness(.88); transform: scale(1.04); }
  .empty-msg { color: #999; font-size: 14px; margin-top: 18px; }
</style>
</head>
<body>
<div class="card">

  <!-- MAIN VIEW: QR code + joined names -->
  <div id="main-view" style="display:none">
    <h1>Scan to join</h1>
    <img class="qr" id="qr" alt="QR code">
    <p class="hint">Names appear below as people join. Click a name to remove it.</p>
    <div class="chip-grid" id="names"></div>
    <p class="empty-msg" id="emptyMsg">No one has joined yet.</p>
  </div>

  <!-- JOIN VIEW: name prompt -->
  <div id="join-view" style="display:none">
    <h1>Enter your name</h1>
    <input id="nameInput" type="text" placeholder="Your name" maxlength="50" autocomplete="off">
    <p class="error" id="joinError"></p>
    <button onclick="submitName()">Join</button>
  </div>

  <!-- SUCCESS VIEW -->
  <div id="success-view" style="display:none">
    <p class="big">Successfully joined!</p>
    <p class="sub" id="successName"></p>
  </div>

</div>

<script>
// ===== Firebase setup =====
const firebaseConfig = {
  apiKey: "AIzaSyBSpDow4pLHjOBknB2EMeGMSSUJGy7DyYE",
  authDomain: "uinformert.firebaseapp.com",
  databaseURL: "https://uinformert-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "uinformert",
  storageBucket: "uinformert.firebasestorage.app",
  messagingSenderId: "769297016408",
  appId: "1:769297016408:web:9b3d2f6af5a22d5d430c2d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ===== Per-device memory =====
const STORE_KEY = "qr_join_name";
function getJoinedName() {
  try { return localStorage.getItem(STORE_KEY); } catch (e) { return null; }
}
function setJoinedName(name) {
  try { localStorage.setItem(STORE_KEY, name); } catch (e) {}
}

// ===== Routing based on URL params =====
const params = new URLSearchParams(location.search);
let view = params.get("join") ? "join" : params.get("success") ? "success" : "main";

// Device already joined? Skip the prompt, go straight to success.
if (view === "join" && getJoinedName()) {
  location.replace(location.pathname + "?success=1");
}

// Success page greets the user by their stored name.
if (view === "success") {
  const name = getJoinedName();
  document.getElementById("successName").textContent = name ? "Welcome, " + name + "!" : "";
}

document.getElementById(view + "-view").style.display = "block";

// Sanitize a name into a valid RTDB key (no . $ # [ ] /), keeps case-insensitive uniqueness
function nameKey(name) {
  return name.toLowerCase().replace(/[.$#[\]/]/g, "").trim();
}

// ===== Chip colors =====
// Fixed pastel palette; the name's key is hashed so each name gets a
// stable "random" color (same for everyone, survives reloads).
const PALETTE = [
  ["#FFD6E0", "#8a2c47"], // pink bg, dark pink text
  ["#FFE8CC", "#8a5514"], // peach
  ["#FFF6BD", "#7d6a0a"], // yellow
  ["#D4F0F0", "#14646b"], // teal
  ["#CCD5FF", "#38418c"], // periwinkle
  ["#E3D5FF", "#5b359e"], // lavender
  ["#D8F3DC", "#2b6b38"], // mint
  ["#FFE0EC", "#a13457"]  // rose
];
function chipColor(key) {
  let h = 0;
  for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length]; // returns [bg, textColor]
}

// Build the join URL (current page URL + ?join=1), then render QR from it
if (view === "main") {
  const url = location.origin + location.pathname + "?join=1";
  document.getElementById("qr").src =
    "https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=" + encodeURIComponent(url);

  // Live grid of name chips — click a chip to remove it
  db.ref("joins").on("value", snap => {
    const data = snap.val() || {};
    const grid = document.getElementById("names");
    const emptyMsg = document.getElementById("emptyMsg");
    grid.innerHTML = "";
    const entries = Object.entries(data);
    emptyMsg.style.display = entries.length ? "none" : "block";

    entries.forEach(([key, entry]) => {
      const [bg, fg] = chipColor(key);
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = entry.name;
      chip.title = "Click to remove";
      chip.style.background = bg;
      chip.style.color = fg;
      chip.onclick = () => {
        db.ref("joins/" + key).remove()
          .catch(err => alert("Could not remove: " + err.message));
      };
      grid.appendChild(chip);
    });
  });
}

// ===== Join submission =====
async function submitName() {
  const input = document.getElementById("nameInput");
  const errorEl = document.getElementById("joinError");
  const name = input.value.trim();
  input.classList.remove("invalid");
  errorEl.textContent = "";

  // Reject truly empty names: blank input, whitespace-only,
  // or names made solely of characters that get stripped (e.g. "...").
  if (!name || !nameKey(name)) {
    input.classList.add("invalid");
    errorEl.textContent = "Please enter a valid name.";
    return;
  }

  try {
    // Transaction guarantees the check and write happen atomically,
    // so two people submitting the same name at the same time can't both win.
    const result = await db.ref("joins/" + nameKey(name)).transaction(current => {
      if (current) return;               // already taken -> abort transaction
      return { name: name, time: Date.now() };
    });

    if (!result.committed) {
      input.classList.add("invalid");
      errorEl.textContent = "That name has already been entered. Try another one.";
      input.select();
      return;
    }
    setJoinedName(name);                 // lock this device to this name
    location.href = location.pathname + "?success=1";
  } catch (err) {
    errorEl.textContent = "Something went wrong: " + err.message;
  }
}

// Enter key submits too
document.getElementById("nameInput")?.addEventListener("keydown", e => {
  if (e.key === "Enter") submitName();
});
</script>
</body>
</html>
