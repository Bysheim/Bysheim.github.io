<!DOCTYPE html>
<html lang="nn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Høveleg Gissing</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
  * { box-sizing: border-box; font-family: system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f6fa; color: #222; }
  #main-wrapper { display: flex; flex-direction: column; align-items: center; gap: 18px; max-width: 90vw; }
  .card { background: #fff; padding: 32px 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.08); text-align: center; max-width: 90vw; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  img.qr { width: 240px; height: 240px; border: 1px solid #ddd; border-radius: 8px; }
  input { padding: 10px 14px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; width: 100%; max-width: 300px; }
  input.invalid { border-color: #c62828; }
  button { margin-top: 16px; padding: 10px 24px; font-size: 16px; border: none; border-radius: 8px; background: #6d4aff; color: #fff; cursor: pointer; }
  button:hover { background: #5a3ce0; }
  button.secondary { background: #fff; color: #6d4aff; border: 1px solid #6d4aff; }
  button.secondary:hover { background: #f0ecff; }
  p.error { color: #c62828; font-size: 14px; margin: 10px 0 0; min-height: 18px; }
  .big { font-size: 26px; font-weight: 600; }
  .sub { font-size: 17px; color: #444; margin-top: 6px; }

  /* Name chip grid — below the QR card */
  .chip-card {
    background: #fff;
    padding: 18px 22px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.06);
    max-width: 90vw;
  }
  .chip-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  .chip {
    display: inline-block;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: filter .15s, transform .15s;
  }
  .chip:hover { filter: brightness(.88); transform: scale(1.04); }
  .empty-msg { color: #999; font-size: 14px; margin: 0; }
</style>
</head>
<body>
<div class="card" id="join-view" style="display:none">
  <h1>Skriv inn namnet ditt</h1>
  <input id="nameInput" type="text" placeholder="Namnet ditt" maxlength="50" autocomplete="off">
  <p class="error" id="joinError"></p>
  <button onclick="submitName()">Bli med</button>
</div>

<div class="card" id="success-view" style="display:none">
  <p class="big">Du er påmeldt!</p>
  <p class="sub" id="successName"></p>
  <button class="secondary" onclick="leave()">Meld meg av</button>
</div>

<!-- HOVEDVISNING: QR-kort med namneliste under -->
<div id="main-wrapper" style="display:none">
  <div class="card">
    <h1>Skann for å bli med</h1>
    <img class="qr" id="qr" alt="QR-kode">
  </div>
  <div class="chip-card">
    <div class="chip-grid" id="names"></div>
    <p class="empty-msg" id="emptyMsg">Ingen har blitt med endå.</p>
  </div>
</div>

<script>
// ===== Firebase-oppsett =====
const firebaseConfig = {
  apiKey: "AIzaSyBSpDow4pLHjOBknB2EMeGMSSUJGy7DyYE",
  authDomain: "uinformert.firebaseapp.com",
  databaseURL: "https://uinformert-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "uinformert",
  storageBucket: "uinformert.firebasestorage.app",
  messagingSenderId: "769297016408",
  appId: "1:769297016408:web:9b3d2f6af5a22d5d430c2d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ===== Per-eininga-lager =====
const STORE_NAME = "qr_join_name";
const STORE_DEVICE = "qr_join_device";
function lsGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, val); } catch (e) {}
}
function lsDel(keys) {
  try { keys.forEach(k => localStorage.removeItem(k)); } catch (e) {}
}
function getDeviceId() {
  let id = lsGet(STORE_DEVICE);
  if (!id) {
    id = Math.random().toString(36).slice(2) + Date.now().toString(36);
    lsSet(STORE_DEVICE, id);
  }
  return id;
}
function getJoinedName() { return lsGet(STORE_NAME); }
function setJoinedName(name) { lsSet(STORE_NAME, name); }
function forgetJoin() { lsDel([STORE_NAME]); }

// Ryddar eit namn til ein gyldig RTDB-nøkkel (utan . $ # [ ] /),
// slik at unikskapen er case-uavhengig
function nameKey(name) {
  return name.toLowerCase().replace(/[.$#[\]/]/g, "").trim();
}

// ===== Rutinging basert på URL-parametrar =====
const params = new URLSearchParams(location.search);
let view = params.get("join") ? "join" : params.get("success") ? "success" : "main";

// Eininga har allereie blitt med? Hopp rett til suksessvisninga.
if (view === "join" && getJoinedName()) {
  location.replace(location.pathname + "?success=1");
}

// Suksessvisning: helsing + levande vakthald over eigen namne-post.
if (view === "success") {
  const name = getJoinedName();
  if (!name) {
    // Ingen lagra namn (t.d. tømtlager) -> tilbake til påmelding
    location.replace(location.pathname + "?join=1");
  } else {
    document.getElementById("successName").textContent = "Velkomen, " + name + "!";
    // Blir namnet fjerna frå databasen (frå hovudsida), blir eininga
    // kasta tilbake til påmeldingssida.
    db.ref("joins/" + nameKey(name)).on("value", snap => {
      if (!snap.exists() && getJoinedName() === name) {
        forgetJoin();
        location.replace(location.pathname + "?join=1");
      }
    });
  }
}

const viewEl = view === "main"
  ? document.getElementById("main-wrapper")
  : document.getElementById(view + "-view");
viewEl.style.display = view === "main" ? "flex" : "block";

// ===== Chip-fargar =====
// Fast palett; namnenøkkelen blir hash'a slik at kvart namn får
// ei stabil "tilfeldig" farge (den same for alle, halder etter oppdateringar).
const PALETTE = [
  ["#FFD6E0", "#8a2c47"], // rosa bakgrunn, mørk rosa tekst
  ["#FFE8CC", "#8a5514"], // fersken
  ["#FFF6BD", "#7d6a0a"], // gul
  ["#D4F0F0", "#14646b"], // turkis
  ["#CCD5FF", "#38418c"], // periwinkle
  ["#E3D5FF", "#5b359e"], // lavendel
  ["#D8F3DC", "#2b6b38"], // mynte
  ["#FFE0EC", "#a13457"]  // rose
];
function chipColor(key) {
  let h = 0;
  for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length]; // returnerer [bakgrunn, tekstfarge]
}

// Bygg påmeldings-URL (denne sida + ?join=1), og teikna QR-koden frå den
if (view === "main") {
  const url = location.origin + location.pathname + "?join=1";
  document.getElementById("qr").src =
    "https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=" + encodeURIComponent(url);

  // Levande rutenett av namne-chips — klikk på ein chip for å fjerna han
  db.ref("joins").on("value", snap => {
    const data = snap.val() || {};
    const grid = document.getElementById("names");
    const emptyMsg = document.getElementById("emptyMsg");
    grid.innerHTML = "";
    const entries = Object.entries(data);
    emptyMsg.style.display = entries.length ? "none" : "block";

    entries.forEach(([key, entry]) => {
      const [bg, fg] = chipColor(key);
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = entry.name;
      chip.title = "Klikk for å fjerna";
      chip.style.background = bg;
      chip.style.color = fg;
      chip.onclick = () => {
        db.ref("joins/" + key).remove()
          .catch(err => alert("Klarte ikkje å fjerna: " + err.message));
      };
      grid.appendChild(chip);
    });
  });
}

// ===== Påmelding =====
async function submitName() {
  const input = document.getElementById("nameInput");
  const errorEl = document.getElementById("joinError");
  const name = input.value.trim();
  input.classList.remove("invalid");
  errorEl.textContent = "";

  // Avvis namn som er tomme: blank input, berre mellomrom,
  // eller namn som berre består av teikn som blir fjerna (t.d. "...").
  if (!name || !nameKey(name)) {
    input.classList.add("invalid");
    errorEl.textContent = "Skriv inn eit gyldig namn.";
    return;
  }

  try {
    // Transaksjonen garanterer at sjekk og skriving skjer atomisk,
    // så to personar som sender same namn samtidig kan ikkje begge vinna.
    const result = await db.ref("joins/" + nameKey(name)).transaction(current => {
      if (current) return;               // allereie tatt -> avbryt transaksjonen
      return { name: name, time: Date.now(), device: getDeviceId() };
    });

    if (!result.committed) {
      input.classList.add("invalid");
      errorEl.textContent = "Dette namnet er allereie teke. Prøv eit anna.";
      input.select();
      return;
    }
    setJoinedName(name);                 // lås denne eininga til dette namnet
    location.href = location.pathname + "?success=1";
  } catch (err) {
    errorEl.textContent = "Noko gjekk gale: " + err.message;
  }
}

// ===== Meld seg av (frå suksesssida) =====
async function leave() {
  const name = getJoinedName();
  try {
    if (name) await db.ref("joins/" + nameKey(name)).remove();
  } catch (err) { /* fjern lokalt uansett */ }
  forgetJoin();
  location.replace(location.pathname + "?join=1");
}

// Enter-tasten sender også
document.getElementById("nameInput")?.addEventListener("keydown", e => {
  if (e.key === "Enter") submitName();
});
</script>
</body>
</html>
